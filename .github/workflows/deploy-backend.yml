name: Deploy Backend

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: skillsprint_ci
          POSTGRES_USER: skillsprint
          POSTGRES_PASSWORD: skillsprint
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skillsprint -d skillsprint_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Initialize pending migration test schema
        env:
          PGPASSWORD: skillsprint
        run: >-
          psql --host=localhost --port=5432 --username=skillsprint --dbname=skillsprint_ci
          --file=database/ci/flyway_v70_baseline.sql --set ON_ERROR_STOP=1

      - name: Apply pending Flyway migrations to PostgreSQL
        run: >-
          mvn -B flyway:migrate
          -Dflyway.url=jdbc:postgresql://localhost:5432/skillsprint_ci
          -Dflyway.user=skillsprint
          -Dflyway.password=skillsprint
          -Dflyway.baselineOnMigrate=true
          -Dflyway.baselineVersion=69

      - name: Run tests
        run: mvn -B test

      - name: Build jar
        run: mvn -B clean package -DskipTests

  deploy:
    needs: validate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests
        run: mvn -B test

      - name: Build jar
        run: mvn -B clean package -DskipTests

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/skillsprint_key
          chmod 600 ~/.ssh/skillsprint_key
          test -s ~/.ssh/skillsprint_key
          ssh-keyscan -T 20 -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts || true

      - name: Upload jar to EC2
        run: |
          scp -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 -i ~/.ssh/skillsprint_key target/*.jar \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/skillsprint.jar.tmp

      - name: Restart backend
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 -i ~/.ssh/skillsprint_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e
            mv /home/${USER}/skillsprint.jar.tmp /home/${USER}/skillsprint.jar
            sudo systemctl restart skillsprint

            echo "Waiting for backend to be ready..."
            for i in {1..15}; do
              if curl -fsS http://127.0.0.1:8080/api/system/status > /tmp/skillsprint-health.json; then
                cat /tmp/skillsprint-health.json
                echo "Backend is ready"
                exit 0
              fi

              echo "Backend not ready yet, retry $i/15..."
              sleep 5
            done

            echo "Backend failed to become ready"
            # `systemctl status` returns a non-zero exit code for a failed service.
            # Do not let `set -e` hide the application logs we need to diagnose it.
            sudo systemctl status skillsprint --no-pager || true
            sudo journalctl -u skillsprint -n 120 --no-pager || true
            exit 1
          EOF

      - name: Public health check
        run: |
          curl -fsS "${{ secrets.HEALTHCHECK_URL }}"
